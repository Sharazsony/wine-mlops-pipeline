name: Wine MLOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: make install

      - name: Lint (flake8)
        run: make lint

      - name: Run data pipeline tests
        run: PYTHONPATH=. pytest tests/test_data.py -v

      - name: Train models and register champion
        run: make train

      - name: MLOps Quality Gate
        run: PYTHONPATH=. pytest tests/test_model_gate.py -v
